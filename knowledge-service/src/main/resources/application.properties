spring.application.name=knowledge-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/mnemo}
spring.datasource.username=bluesbird
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

app.summary.enabled=true
spring.ai.model.chat=ollama
spring.ai.model.embedding=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:4b

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:bluesbird}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:password}
app.events.exchange=notes.events
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
app.events.outbox.poll-delay-ms=1000
app.reset.api-key=${MNEMO_RESET_API_KEY:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
