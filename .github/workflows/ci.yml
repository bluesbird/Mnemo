name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Cross-service integration and UI container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/e2e -p test_harness.py
      - run: python tests/e2e/run.py
      - name: Upload isolated stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: tests/e2e/artifacts/
          retention-days: 7
      - name: Final cleanup after interruption
        if: always()
        run: |
          if [ -f tests/e2e/artifacts/project.txt ]; then
            project=$(cat tests/e2e/artifacts/project.txt)
            docker compose --project-name "$project" --env-file tests/e2e/e2e.env --file tests/e2e/compose.yaml down --volumes --remove-orphans --rmi local --timeout 10
          fi

  ms1:
    name: MS1 (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms1-knowledge-service
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bluesbird
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mnemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluesbird -d mnemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mnemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  ms2:
    name: MS2 (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms2-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ms2-rag-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    name: Deploy to VPS
    needs: [e2e, ms1, ms2, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: vps-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Build and deploy tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/mnemo/Mnemo
          exec 9>/opt/mnemo/Mnemo/.git/deploy.lock
          flock -w 1200 9
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment stopped: VPS checkout has local changes."
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$1" ]; then
            echo "Skipping superseded commit $1."
            exit 0
          fi
          git merge --ff-only "$1"
          docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
          docker compose --env-file deploy/.env -f deploy/compose.yaml build
          docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --no-build
          docker compose --env-file deploy/.env -f deploy/compose.yaml ps
          for path in / /api/v1/notes /rag-api/api/v1/health; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 30 --retry-delay 2 --retry-all-errors --max-time 10 \
              "http://127.0.0.1:8081$path"
          done
          sh -n deploy/reconcile-index.sh
          install -d -m 700 "$HOME/.local/bin" "$HOME/.local/state/mnemo"
          install -m 700 deploy/reconcile-index.sh "$HOME/.local/bin/.mnemo-reconcile.new"
          mv -f "$HOME/.local/bin/.mnemo-reconcile.new" "$HOME/.local/bin/mnemo-reconcile"
          echo "Deployed $1."
          REMOTE
      - name: Verify public HTTPS
        run: |
          set -euo pipefail
          for path in / /api/v1/notes /rag-api/api/v1/health; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 10 --retry-delay 3 --retry-all-errors --max-time 15 \
              "https://mnemo-hub.duckdns.org$path"
          done
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
