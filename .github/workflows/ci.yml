name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Cross-service integration and UI container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/e2e -p test_harness.py
      - run: python tests/e2e/run.py
      - name: Upload isolated stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: tests/e2e/artifacts/
          retention-days: 7
      - name: Final cleanup after interruption
        if: always()
        run: |
          if [ -f tests/e2e/artifacts/project.txt ]; then
            project=$(cat tests/e2e/artifacts/project.txt)
            docker compose --project-name "$project" --env-file tests/e2e/e2e.env --file tests/e2e/compose.yaml down --volumes --remove-orphans --rmi local --timeout 10
          fi

  ms1:
    name: MS1 (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms1-knowledge-service
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bluesbird
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mnemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bluesbird -d mnemo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mnemo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  ms2:
    name: MS2 (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms2-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ms2-rag-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
