services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mnemo}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  knowledge-service:
    build:
      context: ../knowledge-service
    image: mnemo-knowledge-service:deployment
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mnemo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Set RABBITMQ_USER in deploy/.env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
      MNEMO_RESET_API_KEY: ${MNEMO_RESET_API_KEY:?Set MNEMO_RESET_API_KEY in deploy/.env}
      APP_CORS_ALLOWED_ORIGINS: https://mnemo-hub.duckdns.org
      SPRING_PROFILES_ACTIVE: groq
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in deploy/.env}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rag-service:
    build:
      context: ../rag-service
    image: mnemo-rag-service:deployment
    environment:
      RAG_APP_ENV: production
      RAG_KNOWLEDGE_BASE_URL: http://knowledge-service:8080
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_CHAT_PROVIDER: groq
      RAG_GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in deploy/.env}
      RAG_GROQ_MODEL: qwen/qwen3.8-27b
      RAG_CHAT_NUM_PREDICT: 256
      RAG_RABBITMQ_HOST: rabbitmq
      RAG_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Set RABBITMQ_USER in deploy/.env}
      RAG_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in deploy/.env}
      RAG_LOG_FORMAT: json
      RAG_EVENTS_QUEUE: ${RAG_EVENTS_QUEUE:-rag.note-events}
      RAG_EVENTS_DEAD_LETTER_QUEUE: ${RAG_EVENTS_DEAD_LETTER_QUEUE:-rag.note-events.dlq}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rag_data:/app/data
      - rag_hf_cache:/app/.cache
    depends_on:
      rabbitmq:
        condition: service_healthy
      knowledge-service:
        condition: service_started
    restart: unless-stopped

  starter-data:
    image: python:3.12-slim
    command: ["python", "/opt/mnemo/seed.py"]
    restart: "no"
    environment:
      KNOWLEDGE_BASE_URL: http://knowledge-service:8080
      STARTER_NOTES_FILE: /opt/mnemo/starter-notes.json
    volumes:
      - ./seed.py:/opt/mnemo/seed.py:ro
      - ../knowledge-service/src/main/resources/starter-notes.json:/opt/mnemo/starter-notes.json:ro
    depends_on:
      knowledge-service:
        condition: service_started
      rag-service:
        condition: service_healthy

  ui:
    build:
      context: ../ui
    image: mnemo-ui:deployment
    ports:
      - "127.0.0.1:8081:80"
    environment:
      UI_KNOWLEDGE_UPSTREAM: http://knowledge-service:8080
      UI_RAG_UPSTREAM: http://rag-service:8000
      UI_RATE_LIMITS: "on"
    networks:
      default:
      proxy:
        aliases:
          - ui
    depends_on:
      rag-service:
        condition: service_started
      starter-data:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ui:
        condition: service_started
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  postgres_data:
  rabbitmq_data:
  rag_data:
    name: ${RAG_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_rag_data}
  rag_hf_cache:
    name: ${RAG_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_rag_hf_cache}
  caddy_data:
  caddy_config:
