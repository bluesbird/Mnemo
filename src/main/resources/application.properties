spring.application.name=spring-boot-refresh

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/spring_boot_refresh}
spring.datasource.username=bluesbird
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

ai.ollama.enabled=true
ai.ollama.stub-fallback-enabled=true
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:1.7b

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
