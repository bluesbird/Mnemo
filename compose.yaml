services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: bluesbird
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mnemo
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluesbird -d mnemo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bluesbird
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - messaging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  knowledge-service:
    build:
      context: ./knowledge-service
    image: knowledge-service:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mnemo
      SPRING_DATASOURCE_USERNAME: bluesbird
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      MNEMO_RESET_API_KEY: ${MNEMO_RESET_API_KEY:-local-dev-reset-key-only-do-not-use-in-production}
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - db
      - messaging
      - services
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service
    image: rag-service:0.1.0
    ports:
      - "8000:8000"
    environment:
      RAG_KNOWLEDGE_BASE_URL: http://knowledge-service:8080
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_RABBITMQ_HOST: rabbitmq
      RAG_LOG_FORMAT: json
      RAG_EVENTS_QUEUE: ${RAG_EVENTS_QUEUE:-rag.note-events}
      RAG_EVENTS_DEAD_LETTER_QUEUE: ${RAG_EVENTS_DEAD_LETTER_QUEUE:-rag.note-events.dlq}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rag-data:/app/data
      - rag-hf-cache:/app/.cache
    depends_on:
      rabbitmq:
        condition: service_healthy
      knowledge-service:
        condition: service_started
    networks:
      - messaging
      - services
    restart: unless-stopped

  starter-data:
    image: python:3.12-slim
    command: ["python", "/opt/mnemo/seed.py"]
    restart: "no"
    environment:
      KNOWLEDGE_BASE_URL: http://knowledge-service:8080
      STARTER_NOTES_FILE: /opt/mnemo/starter-notes.json
    volumes:
      - ./deploy/seed.py:/opt/mnemo/seed.py:ro
      - ./knowledge-service/src/main/resources/starter-notes.json:/opt/mnemo/starter-notes.json:ro
    depends_on:
      knowledge-service:
        condition: service_started
      rag-service:
        condition: service_healthy
    networks:
      - services

  ui:
    build:
      context: ./ui
    image: mnemo-ui:0.1.0
    ports:
      - "127.0.0.1:5173:80"
    environment:
      UI_KNOWLEDGE_UPSTREAM: http://knowledge-service:8080
      UI_RAG_UPSTREAM: http://rag-service:8000
      UI_RATE_LIMITS: "off"
    depends_on:
      knowledge-service:
        condition: service_started
      rag-service:
        condition: service_started
      starter-data:
        condition: service_completed_successfully
    networks:
      - services
    restart: unless-stopped

networks:
  db:
    driver: bridge
  messaging:
    driver: bridge
  services:
    driver: bridge

volumes:
  db:
  rag-data:
    name: ${RAG_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_rag-data}
  rag-hf-cache:
    name: ${RAG_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_rag-hf-cache}
