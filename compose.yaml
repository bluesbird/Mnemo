services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: bluesbird
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mnemo
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluesbird -d mnemo"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bluesbird
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - messaging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  ms1-knowledge-service:
    build:
      context: ./ms1-knowledge-service
    image: ms1-knowledge-service:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mnemo
      SPRING_DATASOURCE_USERNAME: bluesbird
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_RABBITMQ_HOST: rabbitmq
      MNEMO_RESET_API_KEY: ${MNEMO_RESET_API_KEY:-local-dev-reset-key-only-do-not-use-in-production}
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - db
      - messaging
      - services
    restart: unless-stopped

  ms2-rag-service:
    build:
      context: ./ms2-rag-service
    image: ms2-rag-service:0.1.0
    ports:
      - "8000:8000"
    environment:
      MS2_MS1_BASE_URL: http://ms1-knowledge-service:8080
      MS2_OLLAMA_BASE_URL: http://host.docker.internal:11434
      MS2_RABBITMQ_HOST: rabbitmq
      MS2_LOG_FORMAT: json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ms2-data:/app/data
      - ms2-hf-cache:/app/.cache
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms1-knowledge-service:
        condition: service_started
    networks:
      - messaging
      - services
    restart: unless-stopped

  starter-data:
    image: python:3.12-slim
    command: ["python", "/opt/mnemo/seed.py"]
    restart: "no"
    environment:
      MS1_BASE_URL: http://ms1-knowledge-service:8080
      STARTER_NOTES_FILE: /opt/mnemo/starter-notes.json
    volumes:
      - ./deploy/seed.py:/opt/mnemo/seed.py:ro
      - ./ms1-knowledge-service/src/main/resources/starter-notes.json:/opt/mnemo/starter-notes.json:ro
    depends_on:
      ms1-knowledge-service:
        condition: service_started
      ms2-rag-service:
        condition: service_healthy
    networks:
      - services

  ui:
    build:
      context: ./ui
    image: mnemo-ui:0.1.0
    ports:
      - "127.0.0.1:5173:80"
    environment:
      UI_MS1_UPSTREAM: http://ms1-knowledge-service:8080
      UI_MS2_UPSTREAM: http://ms2-rag-service:8000
      UI_RATE_LIMITS: "off"
    depends_on:
      ms1-knowledge-service:
        condition: service_started
      ms2-rag-service:
        condition: service_started
      starter-data:
        condition: service_completed_successfully
    networks:
      - services
    restart: unless-stopped

networks:
  db:
    driver: bridge
  messaging:
    driver: bridge
  services:
    driver: bridge

volumes:
  db:
  ms2-data:
  ms2-hf-cache:
